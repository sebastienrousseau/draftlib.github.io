<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="draft">
  <title>draft</title>
  <!-- The fountain-pen nib, matching the braille logo the CLI prints from
       internal/brand/brand.go: chamfered shoulders, vent hole, slit, and a
       tip that splits into two tines. The gradient is the same red ramp the
       terminal applies down the nib (#F87171 at the shoulders through to
       #9F1239 at the tip).

       Drawn through a mask rather than fill-rule="evenodd" so the vent hole
       and the slit can overlap without cancelling each other out, and so the
       mark stays correct on any background. -->
  <defs>
    <linearGradient id="nib-ramp" x1="0" y1="11" x2="0" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F87171"/>
      <stop offset="0.5" stop-color="#C93F36"/>
      <stop offset="1" stop-color="#9F1239"/>
    </linearGradient>
    <mask id="nib-mask">
      <rect width="64" height="64" fill="#000"/>
      <!-- Nib body: chamfered shoulders, straight flanks, tapering to a point. -->
      <path d="M15 19 L20 11 L44 11 L49 19 L49 29 L32 55 L15 29 Z" fill="#fff"/>
      <!-- Vent hole. -->
      <circle cx="32" cy="23.5" r="4.2" fill="#000"/>
      <!-- Slit, running from the vent down to just short of the tip so the
           point reads as two tines. Kept wide enough to survive a 16px
           favicon, where a hairline would disappear entirely. -->
      <path d="M30.1 23.5 L33.9 23.5 L32.6 52.5 L31.4 52.5 Z" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b0e14"/>
  <rect width="64" height="64" fill="url(#nib-ramp)" mask="url(#nib-mask)"/>
</svg>
