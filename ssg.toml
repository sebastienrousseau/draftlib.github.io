# Generated site-level configuration for draftlib.github.io
site_name = "draft"
site_title = "draft — From paper to post. Grounded."
site_description = "Turn research papers into publication-ready Markdown where every sentence is grounded in a quote-verified claim from the source. No API key. Works offline. Provenance you can check."
base_url = "https://draftlib.com"
