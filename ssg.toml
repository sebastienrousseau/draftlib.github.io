# ssg (Shokunin Static Site Generator) configuration — draftlib.com
#
# site_name also names the staging output directory and feeds the JSON-LD
# publisher and llms.txt title, so it is "Draftlib", not "docs".

site_name = "Draftlib"
site_description = "draft turns research papers into publication-ready Markdown, with every claim verified verbatim against its source. Go, no API key, works offline."
language = "en-GB"
site_title = "draft — grounded article drafting from research papers"
base_url = "https://draftlib.com"
content_dir = "_posts"
template_dir = "_layouts"
output_dir = "output"
serve_dir = "Draftlib"
