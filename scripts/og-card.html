<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>draft — Open Graph card</title>
    <!--
      Source for /img/og-card.png. Rendered to a 1200x630 PNG by
      scripts/make-og-card.sh; the PNG is committed, so this file is only
      needed when the card is redrawn.

      It is a raster because og:image is consumed by Slack, LinkedIn, X and
      iMessage, none of which render SVG — the card used to point at the
      64x64 draft.svg while declaring 1200x630, so previews came out blank.

      Colours are the site's dark-theme tokens; the nib is the same geometry
      as static/img/draft.svg and the terminal's braille artwork.
    -->
    <style>
      @font-face {
        font-family: "Source Serif 4";
        font-style: normal; font-weight: 700;
        src: url("../static/fonts/source-serif-4-latin-700-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Source Serif 4";
        font-style: normal; font-weight: 400;
        src: url("../static/fonts/source-serif-4-latin-400-normal.woff2") format("woff2");
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body { width: 1200px; height: 630px; }

      body {
        background: #0b0e14;
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 76px 80px;
        overflow: hidden;
        position: relative;
      }

      /* A single warm bloom behind the mark, so the card is not a flat slab. */
      body::before {
        content: "";
        position: absolute;
        top: -260px; left: -200px;
        width: 780px; height: 780px;
        background: radial-gradient(circle, rgba(248, 113, 113, 0.16) 0%, rgba(11, 14, 20, 0) 68%);
        pointer-events: none;
      }

      .lockup { display: flex; align-items: center; gap: 26px; position: relative; }
      .lockup svg { width: 104px; height: 104px; flex: none; }
      .wordmark {
        font-family: "Source Serif 4", Georgia, serif;
        font-weight: 700;
        font-size: 100px;
        letter-spacing: -0.02em;
        line-height: 1;
      }

      .headline {
        position: relative;
        font-family: "Source Serif 4", Georgia, serif;
        font-weight: 700;
        font-size: 60px;
        line-height: 1.14;
        letter-spacing: -0.015em;
        color: #f5f5f7;
      }
      .sub {
        position: relative;
        font-size: 31px;
        line-height: 1.4;
        color: #b9c0cc;
        margin-top: 22px;
      }
      .sub em { font-style: normal; color: #FF8A7A; }

      .foot {
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 40px;
      }
      .cmd {
        font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
        font-size: 20px;
        color: #b9c0cc;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      .domain {
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 30px;
        font-weight: 700;
        color: #FF8A7A;
        white-space: nowrap;
      }
      .rule { height: 4px; background: #F25447; width: 132px; border-radius: 2px; margin-bottom: 30px; position: relative; }
    </style>
  </head>
  <body>
    <div class="lockup">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="og-nib-ramp" x1="0" y1="11" x2="0" y2="55" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#F87171" />
            <stop offset="0.5" stop-color="#C93F36" />
            <stop offset="1" stop-color="#9F1239" />
          </linearGradient>
          <mask id="og-nib-mask">
            <rect width="64" height="64" fill="#000" />
            <path d="M15 19 L20 11 L44 11 L49 19 L49 29 L32 55 L15 29 Z" fill="#fff" />
            <circle cx="32" cy="23.5" r="4.2" fill="#000" />
            <path d="M30.1 23.5 L33.9 23.5 L32.6 52.5 L31.4 52.5 Z" fill="#000" />
          </mask>
        </defs>
        <rect width="64" height="64" fill="url(#og-nib-ramp)" mask="url(#og-nib-mask)" />
      </svg>
      <span class="wordmark">draft</span>
    </div>

    <div>
      <div class="rule"></div>
      <p class="headline">
        Research papers in.<br />
        Publication-ready Markdown out.
      </p>
      <p class="sub">Every claim checked <em>verbatim</em> against its source.</p>
    </div>

    <div class="foot">
      <span class="cmd">go install github.com/sebastienrousseau/draft/cmd/draft@latest</span>
      <span class="domain">draftlib.com</span>
    </div>
  </body>
</html>
