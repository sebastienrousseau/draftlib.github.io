name: CI

# Rebuilds the site from source and runs ssg's audit gates, failing on
# warnings. The deployed docs/ is regenerated in-job, so a source change that
# breaks a gate cannot merge green.
#
# This file previously carried a step list copied from another project
# (pain001): node --test over tests/, four i18n table validators, a content
# integrity check, a link checker, a snippet checker that pip-installed
# pain001, puppeteer layout and print audits, and pa11y-ci. None of those
# twelve files or directories exist in this repository — no tests/, no
# scripts/validate_*.py, no scripts/*_audit.cjs, no .pa11yci — so the job
# failed at the first of them on every run, and had done since the site was
# first committed.
#
# They are removed rather than stubbed. Re-add any of them alongside the
# script it runs, not before: a step that references a missing file is not
# coverage, it is a permanently red build that trains everyone to ignore CI.
#
# Accessibility is still gated. ssg's own wcag gate runs below as part of the
# audit and is what reports "All N page(s) passed checks"; pa11y-ci would have
# added an independent WCAG2AAA pass over the built pages, which is worth
# restoring once a .pa11yci config exists here.

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache ssg binary
        id: cache-ssg
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/ssg
          key: ssg-0.0.48-${{ runner.os }}

      # Pinned to the version the site is authored and verified against
      # locally; a mismatch means CI audits a different renderer than the one
      # that produced the committed docs/.
      - name: Install ssg 0.0.48
        if: steps.cache-ssg.outputs.cache-hit != 'true'
        run: cargo install ssg --locked --version 0.0.48

      - name: Build site
        run: ./build.sh

      - name: Audit gates (fail on warnings)
        run: ssg audit -f ssg.toml -o docs --severity warn --fail-on warn
