<!DOCTYPE html>
<!-- `no-js` is removed by theme-init.js. Until then, and forever if
     scripting is unavailable, the stylesheet uses it to keep every
     JavaScript-dependent affordance in a usable state. -->
<html lang="{{language}}" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>{{title}}</title>

    <!-- Strict same-origin policy. 'wasm-unsafe-eval' is what lets
         WebAssembly.instantiateStreaming run the playground bundle. It permits
         WASM compilation only; it does not re-enable eval() for JavaScript,
         which is why it exists as a separate keyword. Without it the engine
         fails to load with a CompileError and the playground silently becomes
         a static shell. There is no form endpoint: the site posts nothing. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'none';
               object-src 'none';
               script-src 'self';
               style-src 'self';
               img-src 'self' data: https://cloudcdn.pro;
               font-src 'self';
               connect-src 'self';
               manifest-src 'self';
               form-action 'none'"
    />

    {{!primary}}
    {{!opengraph}}
    {{!twitter}}
    {{!apple}}
    {{!microsoft}}

    <!-- Absolute URLs: Open Graph consumers do not resolve relative paths. -->
    <meta property="og:image" content="{{#if og_card}}{{site_url}}og/{{og_card}}.png{{else}}https://cloudcdn.pro/stocks/images/research-paper-1200.webp{{/if}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{title}}" />
    <meta name="twitter:image" content="{{#if og_card}}{{site_url}}og/{{og_card}}.png{{else}}https://cloudcdn.pro/stocks/images/research-paper-1200.webp{{/if}}" />

    <link rel="canonical" href="{{permalink}}" />
    <link rel="alternate" hreflang="{{language}}" href="{{permalink}}" />
    <link rel="alternate" hreflang="x-default" href="{{permalink}}" />

    <link rel="alternate" type="application/rss+xml" title="{{name}} — RSS" href="{{site_path}}rss.xml" />
    <link rel="alternate" type="application/atom+xml" title="{{name}} — Atom" href="{{site_path}}atom.xml" />
    <link rel="alternate" type="application/feed+json" title="{{name}} — JSON Feed" href="{{site_path}}feed.json" />
    <link rel="manifest" href="{{site_path}}manifest.json" />
    <link rel="icon" type="image/svg+xml" href="{{site_path}}logo.svg" />
    <link rel="icon" href="{{site_path}}favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="{{site_path}}apple-touch-icon.png" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />

    <!-- Native cross-document View Transitions. Browsers without support
         ignore the hint and perform an ordinary navigation. -->
    <meta name="view-transition" content="same-origin" />

    <!-- Authored structured data; see README "Structured data". -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "{{site_url}}#website",
            "url": "{{site_url}}",
            "name": "{{name}}",
            "description": "{{description}}",
            "inLanguage": "{{language}}"
          },
          {
            "@type": "Organization",
            "@id": "{{site_url}}#organization",
            "name": "draft",
            "url": "{{site_url}}",
            "logo": "https://cloudcdn.pro/stocks/images/research-paper-1200.webp",
            "description": "draft turns research papers into publication-ready Markdown where every sentence is grounded in a quote-verified claim from the source. No API key. Works offline. Provenance you can check.",
            "sameAs": [
              "https://github.com/sebastienrousseau/draft",
              "https://pkg.go.dev/github.com/sebastienrousseau/draft"
            ]
          },
          {{#if software_app}}
          {
            "@type": "SoftwareApplication",
            "@id": "{{site_url}}#software",
            "name": "draft",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "macOS, Linux, Windows",
            "description": "draft turns research papers into publication-ready Markdown where every sentence is grounded in a quote-verified claim from the source. No API key. Works offline. Provenance you can check.",
            "url": "{{site_url}}",
            "downloadUrl": "https://github.com/sebastienrousseau/draft/releases",
            "softwareHelp": "{{site_url}}documentation/",
            "license": "https://opensource.org/license/mit",
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "author": { "@type": "Person", "name": "Sebastien Rousseau", "url": "https://github.com/sebastienrousseau" }
          },
          {{/if}}
          {{#if breadcrumb}}
          {
            "@type": "BreadcrumbList",
            "@id": "{{permalink}}#breadcrumb",
            "itemListElement": [
              { "@type": "ListItem", "position": 1, "name": "Home", "item": "{{site_url}}" },
              { "@type": "ListItem", "position": 2, "name": "{{headline}}", "item": "{{permalink}}" }
            ]
          },
          {{/if}}
          {{#if faqpage}}
          {
            "@type": "FAQPage",
            "@id": "{{permalink}}#faq",
            "mainEntity": [
              { "@type": "Question", "name": "What does grounded by construction mean?", "acceptedAnswer": { "@type": "Answer", "text": "Before a word is written, draft mines your sources for claims. A claim survives only if its quote appears verbatim in the source and every number in it appears in that quote. The writer is given that verified ledger and nothing else." } },
              { "@type": "Question", "name": "How is this different from RAG, or from asking an LLM to summarise a paper?", "acceptedAnswer": { "@type": "Answer", "text": "Retrieval hands a model source text and hopes it stays faithful. draft verifies each claim before writing, drops anything unverifiable, and attributes every sentence to the claim that backs it. The check is structural, not a prompt." } },
              { "@type": "Question", "name": "Which agent CLIs does it use, and does it need an API key?", "acceptedAnswer": { "@type": "Answer", "text": "No API key. In auto mode draft drives whichever supported agent CLI you are already logged into, such as Claude, Copilot, Codex, Cursor, Grok or Gemini, through that tool's own session. Offline, it uses a local Ollama model." } },
              { "@type": "Question", "name": "Does my paper leave my machine?", "acceptedAnswer": { "@type": "Answer", "text": "It depends on the engine. With a local Ollama model, nothing leaves your machine. With a cloud agent CLI, the source excerpts draft needs to extract and write are sent through that tool under your own session. draft itself has no servers and sends no telemetry." } },
              { "@type": "Question", "name": "What runs fully offline?", "acceptedAnswer": { "@type": "Answer", "text": "Running with the Ollama engine keeps the entire pipeline local. Reading, claim verification, house-style checks and provenance are deterministic and never touch the network." } },
              { "@type": "Question", "name": "What is the C2PA manifest, and what does verify check?", "acceptedAnswer": { "@type": "Answer", "text": "Every article ships a per-sentence attribution file and a C2PA manifest. Running draft --verify recomputes the digests and reports whether the article still matches the ledger it was written from. Editing an unsupported sentence makes it fail." } },
              { "@type": "Question", "name": "What inputs are supported?", "acceptedAnswer": { "@type": "Answer", "text": "PDFs with a text layer, read with pdftotext, or with the Docling reader when tables and structure matter. Scanned PDFs with no text layer are not yet supported." } },
              { "@type": "Question", "name": "Can I use the output commercially?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. draft is free and open source under the MIT or Apache-2.0 licence. No account, no telemetry." } }
            ]
          },
          {{/if}}
          {
            "@type": "WebPage",
            "@id": "{{permalink}}#webpage",
            "url": "{{permalink}}",
            "name": "{{title}}",
            "description": "{{description}}",
            "inLanguage": "{{language}}",
            "isPartOf": { "@id": "{{site_url}}#website" },
            "publisher": { "@id": "{{site_url}}#organization" },
            "datePublished": "{{date}}"
          }
        ]
      }
    </script>

    <!-- One stylesheet, built from styles.css then brand.css in that order —
         brand.css overrides the design system and is unlayered, so it has to
         follow it. Concatenated because both were render-blocking and the page
         waited for the slower of two requests; minified because the sources are
         half comments, which are worth their bytes in the repository and
         nothing at all on the critical path. -->
    <link rel="stylesheet" href="{{site_path}}site.css" />
    <!-- Only the playground needs the app styles. Loading them on every page
         would be a page-weight regression for the pages that never use them. -->
    <!-- Fetched early so it is already in cache when the parser reaches its
         tag at the end of the body. Without this the browser paints the plain
         transcripts, waits a round trip for the script, and then replaces them
         with taller terminals -- a layout shift that only appears over a real
         network, which is why it did not show up locally. -->
    <!-- The banner is the largest thing on the page and therefore what Largest
         Contentful Paint measures. Left to be discovered when the parser reaches
         the image element, it starts only after the stylesheets, and the whole
         page waits on it. Preloading with the same srcset and sizes lets it begin with the
         first bytes of the document and still pick the right candidate. -->
    {{#if banner}}
    <link rel="preload" as="image"
          href="https://cloudcdn.pro/stocks/images/{{banner}}-1200.webp"
          imagesrcset="https://cloudcdn.pro/stocks/images/{{banner}}-640.webp 640w,
                       https://cloudcdn.pro/stocks/images/{{banner}}-1200.webp 1200w"
          imagesizes="100vw"
          fetchpriority="high" />
    {{/if}}
    <script src="{{site_path}}theme-init.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    {{> header}}

    <main id="main">
      {{#block "main"}}{{/block}}
    </main>

    {{> footer}}

    <script src="{{site_path}}main.js" defer></script>
  </body>
</html>
