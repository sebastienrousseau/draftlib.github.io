{{#extends "base"}}
{{#block "main"}}
<!-- Every page opens with the same masthead, and a photograph behind it when
     the page names one. Consistency is the point: a reference page and a
     briefing page should look like parts of the same publication, and the
     difference between them should be the content, not the furniture.

     The scrim does the work. Photographs vary in brightness and colour; the
     gradient does not, so the title has the same contrast whichever image sits
     underneath, and it renders identically on the pages that have no image. -->
<section class="page-banner" aria-labelledby="page-heading">
  {{#if banner}}
  <img class="page-banner-image"
       src="https://cloudcdn.pro/stocks/images/{{banner}}-1200.webp"
       srcset="https://cloudcdn.pro/stocks/images/{{banner}}-640.webp 640w,
               https://cloudcdn.pro/stocks/images/{{banner}}-1200.webp 1200w"
       sizes="100vw"
       width="1280" height="340"
       alt="{{banner_alt}}"
       fetchpriority="high" decoding="async" />
  {{/if}}
  <div class="page-banner-body">
    <div class="container stack">
      <p class="eyebrow">{{eyebrow}}</p>
      <h1 id="page-heading">{{headline}}</h1>
      <p class="lead">{{lead}}</p>
    </div>
  </div>
</section>

<article class="section">
  {{#if toc}}
  <div class="container doc-layout">
    <div class="prose stack doc-main">
      {{!content}}
    </div>
    <aside class="doc-toc" aria-labelledby="toc-title">
      <p class="toc-title" id="toc-title">On this page</p>
      <nav aria-label="On this page"><!--TOC--></nav>
    </aside>
  </div>
  {{else}}
  <div class="container prose stack">
    {{!content}}
  </div>
  {{/if}}
</article>
{{/block}}
